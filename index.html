<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#202226">
<title>ALASKA</title>

<style>
:root {
    --bg: #191a1e;
    --card: #25272d;
    --text: #f0f0f2;
    --muted: #92959d;
    --accent: #c5c8ce;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    color: var(--text);

    background:
        radial-gradient(
            ellipse at 50% 0%,
            #44474e 0%,
            transparent 55%
        ),
        linear-gradient(
            145deg,
            #292b30,
            #17181c 70%
        );
}

.profile {
    width: 100%;
    max-width: 390px;
    padding: 38px 28px 30px;
    text-align: center;

    background: rgba(38, 40, 46, 0.82);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 25px;

    box-shadow:
        0 25px 80px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.06);

    backdrop-filter: blur(20px);
    animation: appear 0.8s ease;
}

.avatar-wrapper {
    width: 116px;
    height: 116px;
    margin: 0 auto 25px;
    padding: 4px;
    border-radius: 50%;

    background: linear-gradient(
        145deg,
        #d5d7dc,
        #555962,
        #25272d
    );

    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
}

.avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    background: #33363d;
}

.name {
    font-size: 31px;
    font-weight: 750;
    letter-spacing: 5px;
    margin-bottom: 8px;
}

.username {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 1px;
}

.line {
    width: 42px;
    height: 1px;
    background: #666a73;
    margin: 25px auto;
}

.description {
    color: #c1c3c9;
    font-size: 14px;
    line-height: 1.8;
    font-weight: 400;
    margin-bottom: 29px;
    white-space: pre-line;
}

.telegram {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;

    width: 100%;
    padding: 15px;

    border-radius: 13px;
    text-decoration: none;

    color: #202126;
    background: linear-gradient(
        135deg,
        #e0e1e4,
        #aeb2ba
    );

    font-size: 12px;
    font-weight: 750;
    letter-spacing: 2px;

    transition: 0.3s ease;
}

.telegram:hover {
    transform: translateY(-3px);
    box-shadow: 0 9px 25px rgba(200,200,210,0.15);
    filter: brightness(1.08);
}

.footer {
    margin-top: 29px;
    color: #666a73;
    font-size: 10px;
    letter-spacing: 2px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

max-width: 420px {
    .profile {
        padding: 34px 23px 27px;
    }
}
</style>
</head>

<body>

<main class="profile">

    <div class="avatar-wrapper">
        <img
            class="avatar"
            id="avatar"
            src="avatar.jpg"
            alt="Аватарка ALASKA"
        >
    </div>

    <h1 class="name">ALASKA</h1>

    <div class="username">@alaskacom</div>

    <div class="line"></div>

    <p class="description">
      давай закроем все окна и двери,
      будем смотреть в потолок,
      я помню такое громкое «верь мне», 
      и тихую пулю в висок
    </p>

    <a
        class="telegram"
        href="https://t.me/alaskacom"
        target="_blank"
        rel="noopener noreferrer"
    >
        TELEGRAM <span>↗</span>
    </a>

    <div class="footer">
        PERSONAL PAGE · 2026
    </div>

</main>

</body>
</html>
