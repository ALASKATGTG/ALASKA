<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#191a1e">

<title>ALASKA — Personal Page</title>

<style>
:root {
    --bg: #191a1e;
    --card: #25272d;
    --text: #f0f0f2;
    --muted: #92959d;
    --border: rgba(255,255,255,.08);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    padding: 35px 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    color: var(--text);

    background:
        radial-gradient(
            ellipse at 50% 0%,
            #41444b 0%,
            transparent 55%
        ),
        linear-gradient(145deg, #292b30, #17181c 75%);
}

.profile {
    width: 100%;
    max-width: 410px;
    padding: 12px;
    overflow: hidden;

    background: rgba(38,40,46,.88);
    border: 1px solid var(--border);
    border-radius: 25px;

    box-shadow: 0 25px 80px rgba(0,0,0,.4);
    backdrop-filter: blur(20px);

    animation: appear .8s ease;
}

/* BANNER */

.banner {
    width: 100%;
    height: 145px;
    overflow: hidden;
    border-radius: 17px;
    background: #34373e;
}

.banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* AVATAR */

.avatar-wrapper {
    width: 112px;
    height: 112px;
    margin: -48px auto 17px;
    padding: 4px;
    position: relative;

    border-radius: 50%;
    background: linear-gradient(
        145deg,
        #e0e1e4,
        #656a74,
        #292b30
    );

    box-shadow: 0 8px 30px rgba(0,0,0,.45);
}

.avatar {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 50%;
    background: #34373e;
}

/* PROFILE INFO */

.name {
    text-align: center;
    font-size: 30px;
    font-weight: 750;
    letter-spacing: 5px;
    margin-bottom: 7px;
}

.username {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
}

.description {
    text-align: center;
    color: #c2c4ca;
    font-size: 14px;
    line-height: 1.8;
    margin: 23px 12px;
}

/* TELEGRAM */

.telegram {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;

    width: 100%;
    padding: 15px;

    border-radius: 13px;
    text-decoration: none;

    color: #202126;
    background: linear-gradient(
        135deg,
        #e0e1e4,
        #adb1b9
    );

    font-size: 12px;
    font-weight: 750;
    letter-spacing: 2px;

    transition: .3s ease;
}

.telegram:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(200,200,210,.16);
}

/* DIVIDER */

.divider {
    height: 1px;
    background: rgba(255,255,255,.08);
    margin: 27px 3px 23px;
}

/* GALLERY */

.gallery-title {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 7px;
}

.gallery-subtitle {
    text-align: center;
    color: #777b84;
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 17px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

.photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;

    border-radius: 11px;
    background: #34373e;

    transition: .25s ease;
}

.photo:hover {
    filter: brightness(1.12);
}

.footer {
    text-align: center;
    color: #686c75;
    font-size: 9px;
    letter-spacing: 2px;
    margin-top: 25px;
    padding-bottom: 9px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

max-width: 380px {
    body {
        padding: 20px 11px;
    }

    .banner {
        height: 125px;
    }

    .name {
        font-size: 27px;
    }

    .gallery {
        gap: 6px;
    }
}
</style>
</head>

<body>

<main class="profile">

    <!-- BANNER -->
    <div class="banner">


<img src="banner.jpg" alt="ALASKA banner">
    </div>

    <!-- AVATAR -->
    <div class="avatar-wrapper">
        <img
            class="avatar"
            src="avatar.jpg"
            alt="ALASKA avatar"
        >
    </div>

    <!-- PROFILE -->
    <h1 class="name">ALASKA</h1>

    <div class="username">
        @alaskacom
    </div>

    <p class="description">
        давай закроем все окна и двери,
        будем смотреть в потолок, 
        я помню такое громкое «верь мне»,
        и тихую пулю в висок
    </p>

    <!-- TELEGRAM -->
    <a
        class="telegram"
        href="https://t.me/alaskacom"
        target="_blank"
        rel="noopener noreferrer"
    >
        TELEGRAM <span>↗</span>
    </a>

    <div class="divider"></div>

    <!-- PHOTO GALLERY -->
    <h2 class="gallery-title">
        MY MOMENTS
    </h2>

    <p class="gallery-subtitle">
        A LITTLE PIECE OF MY WORLD
    </p>

    <div class="gallery">

        <img
            class="photo"
            src="photo1.jpg"
            alt="Photo 1"
        >

        <img
            class="photo"
            src="photo2.jpg"
            alt="Photo 2"
        >

        <img
            class="photo"
            src="photo3.jpg"
            alt="Photo 3"
        >

        <img
            class="photo"
            src="photo4.jpg"
            alt="Photo 4"
        >

        <img
            class="photo"
            src="photo5.jpg"
            alt="Photo 5"
        >

    </div>

    <div class="footer">
        СДЕЛАНО ПО ПРИКОЛУ · 2026
    </div>

</main>

</body>
</html>
